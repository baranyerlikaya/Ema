<body class="layout-home" data-root="./">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <div id="site-sidebar"></div>

  <main id="main">
    <section class="hero">
      <figure class="hero-quote">
        <blockquote>
          <h1 class="hero-title">Give me a place to stand, and I will move the Earth</h1>
        </blockquote>
        <figcaption class="hero-cite">Archimedes</figcaption>
      </figure>
      <p class="hero-intro">Physics documentation for students who love good design</p>
      <div class="hero-actions">
        <a class="btn btn-primary" id="start-link" href="#sections">Start reading</a>
        <a class="btn btn-secondary" href="#sections">All sections <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
    </section>

    <div class="preview" aria-hidden="true">
      <a class="preview-frame" id="preview-link" href="#sections" tabindex="-1">
        <div class="preview-window"><iframe id="preview" title="Topic page preview" tabindex="-1" loading="lazy"></iframe></div>
      </a>
    </div>

    <section class="band" id="sections" aria-labelledby="sections-h">
      <div class="band-inner">
        <div class="section-head">
          <h2 id="sections-h" class="band-title">Mechanics <span class="band-sub" id="topic-count"></span></h2>
          <div class="tabs" role="tablist" aria-label="Filter topics">
            <button class="tab" role="tab" type="button" data-filter="all" data-label="All" aria-selected="true">All</button>
            <button class="tab" role="tab" type="button" data-filter="ready" data-label="Ready" aria-selected="false">Ready</button>
            <button class="tab" role="tab" type="button" data-filter="soon" data-label="Soon" aria-selected="false">Soon</button>
          </div>
        </div>
        <div class="section-grid" id="section-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

</html>
