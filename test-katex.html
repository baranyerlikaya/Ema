<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaTeX test</title>
  <link rel="stylesheet" href="lib/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="lib/katex.min.js"></script>
  <script defer src="lib/auto-render.min.js"></script>
  <script defer src="lib/render-math.js"></script>
</head>
<body>
  <!-- Rendering test only (generic notation, no physics content). Not linked anywhere. Delete before deploying. -->
  <main class="doc-main"><article class="doc">
    <p>Inline: $a^2 + b^2$, $\frac{x}{y}$, $\sqrt{z}$, $\vec{u}\cdot\vec{v}$, $\alpha\beta\gamma$.</p>
    <p>Display:</p>
    $$\int_a^b f(x)\,\mathrm{d}x \qquad \sum_{n=1}^{N} c_n \qquad \begin{pmatrix} 1 & 0 \\ 0 & 1 \end{pmatrix}$$
    <figure class="formula">
      <figcaption class="formula-label">Formula box test</figcaption>
      <div class="formula-body">$$\frac{\mathrm{d}^2 y}{\mathrm{d}t^2} + p\,\frac{\mathrm{d}y}{\mathrm{d}t} + q\,y = 0$$</div>
    </figure>
    <p id="status"></p>
  </article></main>
  <script>
    window.addEventListener('load', function () {
      document.getElementById('status').textContent =
        'Rendered: ' + document.querySelectorAll('.katex').length + ' expressions';
    });
  </script>
</body>
</html>
